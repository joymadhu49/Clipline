name: Clipline
options:
  bundleIdPrefix: com.joymadhu
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: CJZMYQN8V6
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application"
    ENABLE_HARDENED_RUNTIME: YES
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEAD_CODE_STRIPPING: YES
    SWIFT_OPTIMIZATION_LEVEL: "-O"
targets:
  Clipline:
    type: application
    platform: macOS
    sources:
      - Sources
      # Referenced as a file, not a folder. A folder reference copies the folder itself, so
      # the icon lands in Resources/Resources and macOS never finds it.
      - path: Resources/AppIcon.icns
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleName: Clipline
        CFBundleDisplayName: Clipline
        CFBundleIdentifier: com.joymadhu.Clipline
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconFile: AppIcon
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: Copyright 2026 Joy Madhu. All rights reserved.
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
