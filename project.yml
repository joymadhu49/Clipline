name: Clipline
options:
  bundleIdPrefix: com.joymadhu
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: 1.1.1
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: CJZMYQN8V6
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application"
    ENABLE_HARDENED_RUNTIME: YES
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEAD_CODE_STRIPPING: YES
    SWIFT_OPTIMIZATION_LEVEL: "-O"
packages:
  # Auto-updates. Pinned exactly: the generated project is not committed, so there is no
  # Package.resolved to hold the version still between CI runs.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  Clipline:
    type: application
    platform: macOS
    dependencies:
      - package: Sparkle
    sources:
      - Sources
      # Referenced as a file, not a folder. A folder reference copies the folder itself, so
      # the icon lands in Resources/Resources and macOS never finds it.
      - path: Resources/AppIcon.icns
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleName: Clipline
        CFBundleDisplayName: Clipline
        CFBundleIdentifier: com.joymadhu.Clipline
        CFBundleShortVersionString: $(MARKETING_VERSION)
        # Sparkle decides "is this newer" on CFBundleVersion, so it follows the marketing
        # version. A fixed build number would make every release look like the same build.
        CFBundleVersion: $(MARKETING_VERSION)
        CFBundleIconFile: AppIcon
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: Copyright 2026 Joy Madhu. All rights reserved.
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        # Sparkle. The feed is the appcast.xml attached to whichever release is newest,
        # so publishing a release is what publishes the update. Archives are verified
        # against this EdDSA key; its private half lives in the SPARKLE_ED_PRIVATE_KEY
        # secret and the maintainer's login keychain.
        SUFeedURL: https://github.com/joymadhu49/Clipline/releases/latest/download/appcast.xml
        SUPublicEDKey: ajoIDYdrCj59w5c+p+BO7MKoJ8JmwOAeoxDt/YrwuKA=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUEnableSystemProfiling: false
